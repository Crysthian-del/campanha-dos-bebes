<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeria – Campanha dos Bebês</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="galeria.css" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,700&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <header class="navbar">
   <div class="navbar__logo">
      <a href="index.html">
        <img src="images/logo.png" alt="Logo Campanha dos Bebês" class="navbar__logo-img" />
      </a>
      </div>
    <nav class="navbar__links">
      <a href="sobre.html">Sobre</a>
      <a href="projetos.html">Projetos</a>
      <a href="contato.html">Contato</a>
      <a href="galeria.html">Galeria</a>
    </nav>
    <a href="doar.html" class="btn btn--outline-white">Doar</a>
    <button class="navbar__hamburger" aria-label="Abrir menu" id="hamburger">
      <span></span><span></span><span></span>
    </button>
  </header>

  <!-- ===== HERO GALERIA ===== -->
  <section class="gal-hero">
    <div class="gal-hero__content">
      <h1 class="gal-hero__titulo">
        Galeria de<br />
        <em>Momentos</em>
      </h1>
      <p class="gal-hero__desc">Cada gesto de carinho<br />transforma uma história.</p>
    </div>
    <div class="gal-hero__foto">
      <!-- Substitua pela foto de mãe com filho do hero -->
      <img src="images/galeria-hero.jpg" alt="Mãe e filho" />
    </div>
    <div class="gal-hero__onda" aria-hidden="true">
      <svg viewBox="0 0 1440 80" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
        <path d="M0,40 C200,80 400,0 600,40 C800,80 1000,0 1200,40 C1320,64 1400,48 1440,40 L1440,80 L0,80 Z" fill="#ffffff"/>
      </svg>
    </div>
  </section>

  <!-- ===== GALERIA ===== -->
  <section class="galeria-grid" id="galeria">
    <div class="galeria-grid__inner">

      <!--
        ════════════════════════════════════════════
        FOTOS VISÍVEIS INICIALMENTE (primeiras 9)
        Para adicionar fotos: copie um bloco <div class="gal-item">
        e coloque-o onde quiser. As fotos com classe
        "gal-item--tall" são mais altas (ocupam 2 linhas).
        ════════════════════════════════════════════
      -->

      <!-- Foto 1 – grande, ocupa 2 linhas -->
      <div class="gal-item gal-item--tall">
        <img src="images/galeria-1.jpg" alt="Ação 1" loading="lazy" />
      </div>
      <!-- Foto 2 -->
      <div class="gal-item">
        <img src="images/galeria-2.jpg" alt="Ação 2" loading="lazy" />
      </div>
      <!-- Foto 3 -->
      <div class="gal-item">
        <img src="images/galeria-3.jpg" alt="Ação 3" loading="lazy" />
      </div>
      <!-- Foto 4 -->
      <div class="gal-item">
        <img src="images/galeria-4.jpg" alt="Ação 4" loading="lazy" />
      </div>
      <!-- Foto 5 -->
      <div class="gal-item">
        <img src="images/galeria-5.jpg" alt="Ação 5" loading="lazy" />
      </div>

      <!-- Foto 6 – grande, ocupa 2 linhas (início da segunda fileira) -->
      <div class="gal-item gal-item--tall">
        <img src="images/galeria-6.jpg" alt="Ação 6" loading="lazy" />
      </div>
      <!-- Foto 7 -->
      <div class="gal-item">
        <img src="images/galeria-7.jpg" alt="Ação 7" loading="lazy" />
      </div>
      <!-- Foto 8 – grande no centro -->
      <div class="gal-item gal-item--wide">
        <img src="images/galeria-8.jpg" alt="Ação 8" loading="lazy" />
      </div>
      <!-- Foto 9 -->
      <div class="gal-item">
        <img src="images/galeria-9.jpg" alt="Ação 9" loading="lazy" />
      </div>

      <!--
        ════════════════════════════════════════════
        FOTOS EXTRAS — ficam ocultas até clicar em
        "Ver mais fotos". Adicione quantas quiser aqui,
        mantendo a classe "gal-item--extra".
        ════════════════════════════════════════════
      -->

      <div class="gal-item gal-item--extra">
        <img src="images/galeria-10.jpg" alt="Ação 10" loading="lazy" />
      </div>
      <div class="gal-item gal-item--extra">
        <img src="images/galeria-11.jpg" alt="Ação 11" loading="lazy" />
      </div>
      <div class="gal-item gal-item--extra gal-item--tall">
        <img src="images/galeria-12.jpg" alt="Ação 12" loading="lazy" />
      </div>
      <div class="gal-item gal-item--extra">
        <img src="images/galeria-13.jpg" alt="Ação 13" loading="lazy" />
      </div>
      <div class="gal-item gal-item--extra">
        <img src="images/galeria-14.jpg" alt="Ação 14" loading="lazy" />
      </div>
      <div class="gal-item gal-item--extra gal-item--wide">
        <img src="images/galeria-15.jpg" alt="Ação 15" loading="lazy" />
      </div>
      <div class="gal-item gal-item--extra">
        <img src="images/galeria-16.jpg" alt="Ação 16" loading="lazy" />
      </div>
      <div class="gal-item gal-item--extra">
        <img src="images/galeria-17.jpg" alt="Ação 17" loading="lazy" />
      </div>
      <div class="gal-item gal-item--extra">
        <img src="images/galeria-18.jpg" alt="Ação 18" loading="lazy" />
      </div>
      <div class="gal-item gal-item--extra">
        <img src="images/galeria-19.jpg" alt="Ação 19" loading="lazy" />
      </div>
      <div class="gal-item gal-item--extra">
        <img src="images/galeria-20.jpg" alt="Ação 20" loading="lazy" />
      </div>
      <!-- Continue adicionando mais blocos aqui conforme necessário -->

    </div><!-- /galeria-grid__inner -->

    <!-- BOTÃO VER MAIS / VER MENOS -->
    <div class="galeria-grid__btn-wrap">
      <button class="btn btn--ver-mais" id="btn-ver-mais" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="M21 15l-5-5L5 21"/>
        </svg>
        Ver mais fotos
      </button>
    </div>
  </section>

  <!-- ===== LIGHTBOX ===== -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Visualizar foto" hidden>
    <div class="lightbox__overlay" id="lightbox-overlay"></div>
    <div class="lightbox__container">
      <button class="lightbox__fechar" id="lightbox-fechar" aria-label="Fechar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="24" height="24">
          <path stroke-linecap="round" d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
      <button class="lightbox__nav lightbox__nav--prev" id="lightbox-prev" aria-label="Foto anterior">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="26" height="26">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <img class="lightbox__img" id="lightbox-img" src="" alt="" />
      <button class="lightbox__nav lightbox__nav--next" id="lightbox-next" aria-label="Próxima foto">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="26" height="26">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 18l6-6-6-6"/>
        </svg>
      </button>
      <p class="lightbox__contador" id="lightbox-contador"></p>
    </div>
  </div>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <div class="footer__inner">
      <div class="footer__logo">
        <img src="images/logobranca.png" alt="Logo" class="footer__logo-img" />
        <div>
          <p class="footer__logo-small">Associação das Senhoras da</p>
          <p class="footer__logo-name">Campanha dos Bebês</p>
        </div>
      </div>
      <div class="footer__social">
        <p class="footer__social-label">Acompanhe nossas ações</p>
        <div class="footer__social-icons">

      </div>
